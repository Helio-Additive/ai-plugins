name: Release OpenAI plugins

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GENERATE_TEST: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: devbox run bun install --frozen-lockfile
      - name: Validate release version
        run: devbox run bun -e 'if (process.env.RELEASE_TAG.replace(/^v/, "") !== (await import("./package.json")).default.version) throw new Error("Release tag must match package.json version")'
      - name: Generate production packages
        run: devbox run just make
      - name: Zip OpenAI packages
        run: devbox run bun scripts/package-release.ts "$RELEASE_TAG"
      - name: Validate release ZIP contents
        run: python3 scripts/check-release.py
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/releases/*-openai-submission-*.zip dist/releases/*-codex-desktop-*.zip --clobber
