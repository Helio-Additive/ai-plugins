name: Package checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Check generated output is committed
        run: |
          git diff --exit-code -- .claude-plugin/marketplace.json lib/_generated plugins/*/_generated
          test -z "$(git ls-files --others --exclude-standard -- .claude-plugin/marketplace.json lib/_generated 'plugins/*/_generated/**')"
