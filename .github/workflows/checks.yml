name: Package checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: devbox run bun install --frozen-lockfile
      - name: Build packages
        run: devbox run bun run build
      - name: Typecheck
        run: devbox run bun run typecheck
      - name: Test endpoint generation
        run: devbox run bun run test
      - name: Validate release ZIP contents
        run: |
          devbox run bun scripts/package-release.ts "v$(node -p "require('./package.json').version")"
          python3 scripts/check-release.py
      - name: Check generated output is committed
        run: |
          git diff --exit-code -- .claude-plugin/marketplace.json lib/_generated plugins/*/_generated
          test -z "$(git ls-files --others --exclude-standard -- .claude-plugin/marketplace.json lib/_generated 'plugins/*/_generated/**')"
