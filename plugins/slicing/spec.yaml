# yaml-language-server: $schema=../../schemas/plugin-spec.schema.json
name: helioadditive-slicing
description: >-
  Create, monitor, and retrieve Helio Additive slicing jobs. Powered by Helio
  slicer-cli with Bambu Studio, OrcaSlicer and Snapmaker Orca engines.
  Source code, licences and acknowledgements:
  https://github.com/Helio-Additive/slicer-cli/blob/main/docs/open-source.md
homepage: https://www.helioadditive.com
displayName: Helio Slicing
shortDescription: Create and track 3D prints
longDescription: >-
  Connect to Helio Additive to create slicing jobs, check their progress, and
  retrieve completed outputs. Slicing uses Helio slicer-cli with Bambu Studio,
  OrcaSlicer and Snapmaker Orca engines. Source code, licences and acknowledgements:
  https://github.com/Helio-Additive/slicer-cli/blob/main/docs/open-source.md
defaultPrompts:
  - Slice this .stl file
  - Show me my recent slices
  - Check the progress of my slice
testPath: /slicing
mcp:
  openai:
    url: https://mcp.helioadditive.com/openai/slicing
    clientId: openai-plugin
    scopes:
      - slicing
  anthropic:
    url: https://mcp.helioadditive.com/anthropic/slicing
    clientId: claude-plugin
    scopes:
      - slicing
  kimi-global:
    url: https://mcp.helioadditive.com/kimi/slicing
  kimi-china:
    url: https://mcp2.helioam.cn/kimi/slicing
  generic:
    url: https://mcp.helioadditive.com/slicing
    clientId: generic-agent
    scopes:
      - slicing
