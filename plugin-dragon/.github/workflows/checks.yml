name: Package checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install Jsonnet
        run: sudo apt-get update && sudo apt-get install -y jsonnet
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build packages
        run: bun run scripts/build.ts
      - name: Validate packages
        run: bun run scripts/validate.ts
      - name: Check generated output is committed
        run: git diff --exit-code -- vendors
